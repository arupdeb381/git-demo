<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Version 2.0.0</title>
  <style>
    /* minimal, clean centering */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d1117;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 1rem;
    }

    .version-container {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 3rem 4rem;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .version-label {
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8b949e;
      margin-bottom: 0.75rem;
      font-weight: 400;
    }

    .version-number {
      font-size: 5rem;
      font-weight: 700;
      color: #f0f6fc;
      line-height: 1.2;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #c9d1d9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* small responsive touch */
    @media (max-width: 480px) {
      .version-container {
        padding: 2rem 2.5rem;
      }
      .version-number {
        font-size: 3.5rem;
      }
      .version-label {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="version-container">
    <div class="version-label">Application version</div>
    <div class="version-number">2.0.0</div>
  </div>
</body>
</html>
